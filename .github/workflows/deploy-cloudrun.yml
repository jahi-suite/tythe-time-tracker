name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/144765655694/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-cloudrun-deployer@karitime.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: tt-ts
        run: |
          gcloud run deploy tythe-time-tracker \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --quiet \
            --project "${{ secrets.GCP_PROJECT_ID }}"
